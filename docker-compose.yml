services:
  go2rtc:
    # v1.9.15 + go2rtc PR #2531 (Xiaomi pan/tilt motor, commit e23a21b), built on the LXC from
    # /opt/build/go2rtc-ptz. Roll back to alexxit/go2rtc:1.9.15 if needed (only PTZ is lost).
    image: go2rtc-local:1.9.15-ptz-e23a21b
    pull_policy: never
    container_name: xiaomi-go2rtc
    restart: unless-stopped
    # host network: Xiaomi CS2 (UDP) to the cameras and WebRTC media on 8555
    network_mode: host
    volumes:
      - ./config:/config

  postgres:
    image: postgres:16.10
    container_name: xiaomi-cam-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: xiaomi_cam
      POSTGRES_USER: xiaomi_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xiaomi_app -d xiaomi_cam"]
      interval: 5s
      retries: 10

  app:
    build: .
    image: xiaomi-cam-app:local
    container_name: xiaomi-cam-app
    restart: unless-stopped
    # host network: miIO (UDP 54321) to the cameras, go2rtc and postgres on localhost
    network_mode: host
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      go2rtc:
        condition: service_started
    volumes:
      # writable: adding a Xiaomi camera in the UI stores its token here
      - ./config/miio_tokens.json:/config/miio_tokens.json
      # CT-wide CPU/RAM from scripts/hoststats.py (runs in the LXC: inside Docker, lxcfs only
      # describes this container) and a bind mount on the root disk for its free space
      - ./data/hoststats:/host/stats:ro
      - ./data/fsprobe:/host/fs:ro
      # requests for scripts/streamctl.py (runs in the LXC): reconnect a camera source in go2rtc
      - ./data/streamctl:/host/streamctl

  caddy:
    # HTTPS in front of the app (local CA); config/Caddyfile is server-specific, see Caddyfile.example
    image: caddy:2.11.6
    container_name: xiaomi-cam-https
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./config/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      # tailscaled's socket: Caddy gets publicly trusted certificates for *.ts.net names from it
      - /var/run/tailscale:/var/run/tailscale
    depends_on:
      - app

  recorder:
    # same image as the app; records independently of logged-in users
    image: xiaomi-cam-app:local
    pull_policy: never
    container_name: xiaomi-cam-recorder
    restart: unless-stopped
    command: ["python", "-m", "app.recorder"]
    # host network: go2rtc RTSP on localhost, SMB to the share on the LAN
    network_mode: host
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      app:
        condition: service_started  # runs the migrations
    # time to close the current segment and join the last clip
    stop_grace_period: 40s
    volumes:
      # local buffer: 10 s segments and clips waiting for upload (owned by uid 10001)
      - ./data/recbuf:/recbuf
      # object detection model for AI verification of motion (YOLOX-tiny, see README)
      - ./data/models:/models:ro

volumes:
  postgres_data:
  caddy_data:     # holds the local CA: back it up, or devices must trust a new root after a rebuild
  caddy_config:
