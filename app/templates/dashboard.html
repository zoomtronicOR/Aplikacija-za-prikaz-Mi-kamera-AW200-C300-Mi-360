{% extends "base.html" %}
{% block head %}<script type="module" src="/player/video-stream.js"></script>{% endblock %}
{% block body %}
{% include "_nav.html" %}
<main id="grid" class="cam-grid p-3"></main>

<template id="cam-card">
  <section class="card cam">
    <div class="card-header d-flex align-items-center gap-2 py-2">
      <span class="dot" title=""></span>
      <div class="flex-grow-1 text-truncate"><strong class="name"></strong> <span class="loc text-body-secondary small"></span></div>
      <span class="rec-badge badge text-bg-danger d-none" title="">● REC</span>
      <button class="btn btn-sm btn-outline-danger btn-rec" title="Ručno snimanje">REC</button>
      <button class="btn btn-sm btn-outline-secondary btn-quality" title="Kvalitet slike">HD</button>
      <button class="btn btn-sm btn-outline-secondary btn-controls" title="Kontrole">⚙</button>
      <button class="btn btn-sm btn-outline-secondary btn-fs" title="Ceo ekran">⛶</button>
    </div>
    <div class="view"></div>
    <div class="controls card-body py-2 d-none"></div>
  </section>
</template>

<script type="module" src="/static/app.js"></script>
{% endblock %}
